[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Default: parallel unit suite. Packaging/wheel builds are @pytest.mark.slow
# and are excluded here so local smoke stays fast. CI opts back in with
# -m "slow or not slow" (see .github/workflows/ci.yml).
addopts = -n 18 -m "not slow"
markers =
    slow: packaging checks that run npm and/or python -m build (skip locally; run in CI)
filterwarnings =
    ignore:tagMap is deprecated:DeprecationWarning
    ignore:typeMap is deprecated:DeprecationWarning
