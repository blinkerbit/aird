[Service]
# Public WebAuthn RP for dx6si.aiccloud.online (Authentik front door is HTTPS).
Environment=AIRD_WEBAUTHN_RP_ID=dx6si.aiccloud.online
Environment=AIRD_WEBAUTHN_ORIGIN=https://dx6si.aiccloud.online
# Set to your APK signing cert SHA-256 (colon-separated). Also stored via android-facet POST.
# Debug: keytool -list -v -keystore %USERPROFILE%\.android\debug.keystore -alias androiddebugkey -storepass android
# Environment=AIRD_ANDROID_CERT_SHA256=AA:BB:...