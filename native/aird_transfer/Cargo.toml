[package]
name = "aird_transfer"
version = "0.1.0"
edition = "2021"
description = "Native socket→disk upload pumps for AIRD (Tornado)"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
