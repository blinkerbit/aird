name: wheels

# Binary wheels for aird-transfer. The aird package is published by ci.yml:
# dev → dev patch, pre-release → release candidate, main → patch.

on:
  workflow_dispatch:
  push:
    tags:
      - "aird-transfer-v*"

jobs:
  aird-transfer:
    name: aird-transfer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native/aird_transfer
          args: --release --out dist -i 3.10 3.11 3.12 3.13
          sccache: "true"
          manylinux: auto

      - name: Build sdist (Linux only)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native/aird_transfer
          command: sdist
          args: --out dist
          sccache: "true"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aird-transfer-${{ matrix.os }}
          path: native/aird_transfer/dist/*

  publish-aird-transfer:
    name: Publish aird-transfer to PyPI
    needs: [aird-transfer]
    if: startsWith(github.ref, 'refs/tags/aird-transfer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aird-transfer-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
