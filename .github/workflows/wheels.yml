name: wheels

# Binary wheels for aird-transfer. The aird package is published by ci.yml:
# main → patch, rc → release candidate, feature branches → dev.

on:
  workflow_dispatch:
  push:
    tags:
      - "aird-transfer-v*"

jobs:
  aird-transfer:
    name: aird-transfer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native/aird_transfer
          args: --release --out dist -i 3.10 3.11 3.12 3.13
          sccache: "true"
          manylinux: auto

      - name: Build sdist (Linux only)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native/aird_transfer
          command: sdist
          args: --out dist
          sccache: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aird-transfer-${{ matrix.os }}
          path: native/aird_transfer/dist/*

  publish-aird-transfer:
    name: Publish aird-transfer to PyPI
    needs: [aird-transfer]
    if: startsWith(github.ref, 'refs/tags/aird-transfer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aird-transfer-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
