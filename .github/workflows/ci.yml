name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package with chat extra
        run: |
          python -m pip install -U pip
          pip install -e ".[chat]" build

      - name: Build share UI bundle
        run: |
          npm ci --ignore-scripts
          npm run js:share

      - name: Run tests
        run: python -m pytest tests/ -q --tb=no
