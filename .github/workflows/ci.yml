name: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# feature PR → dev. Push to dev publishes a dev patch (0.5.6 → 0.5.7.devN).
# PR dev → pre-release. Push to pre-release publishes an RC (0.5.7rcN).
# PR pre-release → main. Push to main publishes the patch (0.5.7).
# Publish runs only when PYPI_API_TOKEN is set. The version commit includes
# [skip ci] so it does not publish again.

on:
  push:
    branches: [dev, pre-release, main]
  pull_request:
    branches: [dev, pre-release, main]

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Frontend tests and lint
        run: |
          python -m pip install "nox>=2024.4.15"
          nox -s js quality

  tests:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Backend tests
        env:
          AIRD_CI: "1"
        run: |
          python -m pip install "nox>=2024.4.15"
          nox -s tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('coverage.xml') != ''
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  sonar-token:
    name: Sonar token
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  sonar:
    name: sonar
    needs: [tests, sonar-token]
    if: needs.sonar-token.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: .

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  promote:
    name: promote
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check promotion path
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            dev)
              ;;
            pre-release)
              if [ "$HEAD_REF" != "dev" ]; then
                echo "pre-release only accepts pull requests from dev (got ${HEAD_REF})"
                exit 1
              fi
              ;;
            main)
              if [ "$HEAD_REF" = "pre-release" ]; then
                exit 0
              fi
              PRE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/pre-release" --jq .sha 2>/dev/null || true)
              if [ -n "${PRE_SHA}" ] && [ "$HEAD_SHA" = "$PRE_SHA" ]; then
                echo "head matches pre-release ${PRE_SHA}"
                exit 0
              fi
              echo "main only accepts pull requests from pre-release (got ${HEAD_REF})"
              exit 1
              ;;
            *)
              echo "unsupported base branch: ${BASE_REF}"
              exit 1
              ;;
          esac

  pypi-token:
    name: PyPI token
    if: >-
      github.event_name == 'push' &&
      github.repository == 'blinkerbit/aird' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/pre-release' ||
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "${PYPI_API_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish
    needs: [frontend, tests, pypi-token]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'blinkerbit/aird' &&
      needs.pypi-token.outputs.present == 'true' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/pre-release' ||
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Choose version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            CHANNEL=main
            SEQ=0
          elif [ "${GITHUB_REF}" = "refs/heads/pre-release" ]; then
            CHANNEL=rc
            PROBE=$(python scripts/release_version.py --channel rc --seq 1)
            BASE=${PROBE%rc*}
            COUNT=$(git tag -l "v${BASE}rc*" | wc -l | tr -d ' ')
            SEQ=$((COUNT + 1))
          elif [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            CHANNEL=dev
            SEQ="${GITHUB_RUN_ID}"
          else
            echo "unsupported ref ${GITHUB_REF}" >&2
            exit 1
          fi
          VERSION=$(python scripts/release_version.py --channel "$CHANNEL" --seq "$SEQ" --write)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Build frontend bundles
        run: |
          npm ci --ignore-scripts
          npm run js:build

      - name: Build sdist + wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-binary=http-ece -r requirements-ci.txt
          python -m build --sdist --wheel -o dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CHANNEL" = "main" ] || [ "$CHANNEL" = "rc" ]; then
            git add setup.py
            git commit -m "Release ${VERSION} [skip ci]"
            git tag "v${VERSION}"
            git push origin HEAD
            git push origin "v${VERSION}"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          if [ "$CHANNEL" = "main" ]; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes "Patch release ${VERSION}."
          elif [ "$CHANNEL" = "rc" ]; then
            gh release create "v${VERSION}" --prerelease --title "v${VERSION}" --notes "Release candidate ${VERSION}."
          else
            gh release create "v${VERSION}" --prerelease --title "v${VERSION}" --notes "Dev release ${VERSION}."
          fi
