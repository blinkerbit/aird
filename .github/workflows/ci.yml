name: ci

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install package with chat extra
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
          python -m build --wheel -o dist
          WHEEL=$(ls dist/*.whl | head -1)
          # Runtime deps already installed from hashed lockfile; install local wheel only.
          python -m pip install --no-deps --only-binary=:all: "${WHEEL}"

      - name: Build share UI bundle
        run: |
          npm ci --ignore-scripts
          npm run js:share

      - name: Run tests
        run: python -m pytest tests/ -q --tb=no
