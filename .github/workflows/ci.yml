name: ci

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d274f6b6b64417e # v4

      - uses: actions/setup-python@0b93645e7b0624c84cb932f9b9f9324e4ea2796f # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@499707a41cbb9f785f5999a3343e293bb4556f0 # v4
        with:
          node-version: "22"

      - name: Install package with chat extra
        run: |
          python -m pip install "pip==25.2"
          python -m pip install --only-binary=:all: -r requirements-ci.txt
          python -m build --wheel -o dist
          WHEEL=$(ls dist/*.whl | head -1)
          python -m pip install --only-binary=:all: "${WHEEL}[chat]"

      - name: Build share UI bundle
        run: |
          npm ci --ignore-scripts
          npm run js:share

      - name: Run tests
        run: python -m pytest tests/ -q --tb=no
