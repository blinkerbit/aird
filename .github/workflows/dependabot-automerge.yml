name: dependabot-automerge

# Dependabot opens pull requests against dev. Patch and minor updates merge
# after frontend, tests, and promote pass. Major updates stay for review.
# This workflow does not check out pull request code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'blinkerbit/aird'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Queue auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL" || true
          gh pr merge --auto --squash "$PR_URL"
