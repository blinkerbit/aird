name: Bug report
description: Something in Aird does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -m aird --version`, or the git revision.
      placeholder: "0.5.6"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact tokens and file paths that are private.
    validations:
      required: false
