# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    exclude-paths:
      # Hashed lockfile; bump pins in requirements-ci.in then recompile:
      #   uv pip compile --generate-hashes -o requirements-ci.txt requirements-ci.in
      - requirements-ci.txt

  - package-ecosystem: cargo
    directory: /native/aird_transfer
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
