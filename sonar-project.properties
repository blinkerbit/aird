# Tooling stays out of the production analysis. tests/ is sonar.tests, not source.
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/.pytest_cache/**,**/.github/**,manage.py,aird/ms/**,aird/static/js/aird-core.js,aird/static/js/share/app.js,aird/static/js/browse/app.bundle.js,aird/static/js/pages/dist/**,aird/static/js/vendor/**

sonar.sources=aird
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
