<!DOCTYPE html>
<html lang="en">
<head>
  {% include '../_theme_early.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}" />
  <link rel="stylesheet" href="{{ static_url('css/collab.css') }}" />
  <title>Lists · Aird</title>
</head>
<body>
  <div class="aird-shell aird-shell--wide">
{% include '../_app_nav_header.html' %}
    <main class="lists-hub collab-hub" data-hub="lists" data-me="{{ escape(current_user.get('username') if current_user else '') }}" data-reminders="{{ '1' if is_feature_enabled('reminders') else '0' }}">
      <div class="lists-hub-body" id="listsHubBody" data-mobile-view="lists">
        <header class="ub-top">
          <button type="button" id="listsCollapse" aria-label="Collapse sidebar">≡</button>
          <div class="ub-crumb-wrap">
            <nav id="listsCrumbs" class="ub-crumbs" aria-label="Breadcrumb"></nav>
            <button type="button" id="listsHelp" class="lists-help" aria-label="How to use lists" aria-expanded="false">i</button>
          </div>
          <div class="ub-top-actions">
            <button type="button" id="listsViewBtn">View</button>
            <button type="button" id="listsMetaToggle" class="is-on" aria-expanded="true" aria-controls="listsInspector">Details</button>
            <button type="button" id="listsMoreBtn" aria-label="More">⋮</button>
          </div>
        </header>
        <aside class="lists-rail" id="listsRail" aria-label="Lists">
          <div id="listsTagFilter" class="ub-tag-filter"></div>
          <div id="listsRailNav"></div>
        </aside>
        <section class="lists-editor" id="listsEditor" aria-live="polite" aria-label="List editor">
          <div class="collab-empty">Create or select a list.</div>
        </section>
        <section class="lists-board" id="listsBoard" hidden></section>
        <aside class="lists-meta" id="listsInspector" aria-label="List details">
          <header class="lists-meta-head">
            <strong>Details</strong>
            <button type="button" id="listsMetaCollapse" aria-label="Collapse details">⟩</button>
          </header>
          <div class="lists-meta-scroll">
            <div id="listsItemDetails" hidden></div>
            <div id="listsMetaBody"></div>
          </div>
        </aside>
      </div>
      <button type="button" id="listsGroupBtn" hidden>New group</button>
      <button type="button" id="listsNewBtn" hidden>New list</button>
    </main>
  </div>
  <script nonce="{{ csp_nonce }}" src="{{ static_url('js/theme.js') }}"></script>
  <script nonce="{{ csp_nonce }}" type="module" src="{{ static_url('js/pages/lists.js') }}"></script>
</body>
</html>
