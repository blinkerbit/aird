<!DOCTYPE html>
<html lang="en">
<head>
  {% include '../_theme_early.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}" />
  <link rel="stylesheet" href="{{ static_url('css/collab.css') }}" />
  <title>Lists · Aird</title>
</head>
<body>
  <div class="aird-shell aird-shell--wide">
{% include '../_app_nav_header.html' %}
    <main class="collab-hub" data-hub="lists" data-me="{{ escape(current_user.get('username') if current_user else '') }}">
      <header class="collab-hub-head">
        <h1 class="text-2xl font-bold">Lists</h1>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button type="button" class="btn btn-ghost btn-sm" id="listsGroupBtn">New group</button>
          <button type="button" class="btn btn-primary btn-sm" id="listsNewBtn">New list</button>
        </div>
      </header>
      <div class="collab-layout">
        <aside class="collab-index" id="listsIndex" aria-label="Your lists"></aside>
        <section class="collab-detail" id="listsDetail" aria-live="polite">
          <div class="collab-empty">Create or select a list.</div>
        </section>
      </div>
    </main>
  </div>
  <script nonce="{{ csp_nonce }}" src="{{ static_url('js/theme.js') }}"></script>
  <script nonce="{{ csp_nonce }}" type="module" src="{{ static_url('js/pages/lists.js') }}"></script>
</body>
</html>
