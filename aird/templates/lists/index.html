<!DOCTYPE html>
<html lang="en">
<head>
  {% include '../_theme_early.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}" />
  <link rel="stylesheet" href="{{ static_url('css/collab.css') }}" />
  <title>Lists · Aird</title>
</head>
<body>
  <div class="aird-shell aird-shell--wide">
{% include '../_app_nav_header.html' %}
    <main class="ln" data-hub="lists" data-me="{{ escape(current_user.get('username') if current_user else '') }}" data-reminders="{{ '1' if is_feature_enabled('reminders') else '0' }}" data-screen="index">
      <aside class="ln-side" id="listsRail" aria-label="Views">
        <label class="ln-search">
          <span class="lists-sr">Search</span>
          <input id="listsSearch" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
        </label>
        <div id="listsSideNav"></div>
      </aside>
      <div class="ln-main" id="listsHubBody" data-view="today">
        <section class="ln-index" id="listsBoard" aria-label="Lists"></section>
        <section class="ln-doc" id="listsEditor" aria-live="polite" aria-label="Editor">
          <div class="collab-empty">Create or select a list.</div>
        </section>
      </div>
    </main>
  </div>
  <script nonce="{{ csp_nonce }}" src="{{ static_url('js/theme.js') }}"></script>
  <script nonce="{{ csp_nonce }}" type="module" src="{{ static_url('js/pages/lists.js') }}"></script>
</body>
</html>
